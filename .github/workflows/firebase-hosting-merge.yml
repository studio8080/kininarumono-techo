name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: kininarumono-techo
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # PICKS を足したのにカテゴリページを再生成し忘れると、/category/* が古いまま公開される。
      # 生成物はコミット済みなので、ここで作り直して差分が出たら止める（＝入れ忘れに気づける）。
      # 直し方: ローカルで node tools/build-category.mjs を実行してコミットする。
      - name: Check generated pages are up to date
        run: |
          node tools/build-category.mjs
          node tools/build-roundup.mjs
          node tools/build-read-hub.mjs
          if ! git diff --quiet -- public/category public/read public/sitemap.xml; then
            echo "::error::生成ページが古いです。ローカルで node tools/build-category.mjs と node tools/build-roundup.mjs と node tools/build-read-hub.mjs を実行してコミットしてください。"
            git --no-pager diff --stat -- public/category public/read public/sitemap.xml
            exit 1
          fi
      - name: Syntax check main.js
        run: node --check public/js/main.js
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project kininarumono-techo
